name: CNB 镜像同步

# 把 GitHub 上的代码与发布产物同步到 CNB（cnb.cool），供国内直连下载：
# - 代码：push 时镜像全部分支与标签（不删除 CNB 上独有的分支，更新频道分支在那里）。
# - 发布产物：在 release.yml 里随发布一起上传；本工作流的手工触发用于补做历史发布。
on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  workflow_dispatch:
    inputs:
      tag:
        description: 需要补做镜像的发布标签（留空同步最新的正式发布）
        required: false
        default: ''

permissions:
  contents: read

env:
  CNB_REPO: totok22/can-host
  # 必须与 scripts/cnb_publish.py 的 DEFAULT_CHANNEL_BRANCH 一致：这个分支只存在于 CNB，
  # 下面的清理逻辑要跳过它。
  CHANNEL_BRANCH: cnb-update

jobs:
  code:
    name: 同步分支与标签
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 推送全部分支与标签到 CNB
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CNB_TOKEN:-}" ]; then
            echo "::error::仓库缺少 Actions secret CNB_TOKEN，无法同步到 CNB"
            exit 1
          fi
          git fetch --no-tags origin "+refs/heads/*:refs/remotes/origin/*"
          git remote add cnb "https://cnb:${CNB_TOKEN}@cnb.cool/${CNB_REPO}"
          # 不用 --mirror/--prune：--prune 会连带删掉只存在于 CNB 的更新频道分支。
          git push cnb --force \
            "+refs/remotes/origin/*:refs/heads/*" \
            "+refs/tags/*:refs/tags/*"

      - name: 清理 CNB 上已不存在的分支
        # 与上一步配套：镜像不 prune，所以这里显式删除 GitHub 上已删除的分支，
        # 但保留更新频道分支（CHANNEL_BRANCH），避免镜像仓库越积越乱。
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t cnb_branches < <(git ls-remote --heads cnb | sed 's#.*refs/heads/##')
          mapfile -t github_branches < <(git ls-remote --heads origin | sed 's#.*refs/heads/##')
          for branch in "${cnb_branches[@]}"; do
            if [ "$branch" = "${CHANNEL_BRANCH}" ]; then
              echo "保留更新频道分支 $branch"
              continue
            fi
            if printf '%s\n' "${github_branches[@]}" | grep -qx "$branch"; then
              continue
            fi
            echo "删除 CNB 上已不存在的分支：$branch"
            git push cnb --delete "$branch"
          done

  release:
    name: 同步发布产物
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 拉取 GitHub 发布并镜像到 CNB
        # 脚本自己判断"已是最新镜像"，因此重复触发是安全的：
        # 附件齐全时只做几次 API 调用就退出。
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${CNB_TOKEN:-}" ]; then
            echo "::error::仓库缺少 Actions secret CNB_TOKEN，无法同步到 CNB"
            exit 1
          fi
          python scripts/cnb_publish.py sync \
            --repo "${CNB_REPO}" \
            --github-repo "${GITHUB_REPOSITORY}" \
            --tag "${{ inputs.tag }}" \
            --download-dir cnb-assets
