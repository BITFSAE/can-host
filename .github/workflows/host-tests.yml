name: BMS 上位机单元测试

on:
  push:
    branches: [main]
    paths:
      - 'TOOLS/bms_host/**'
      - 'Tests/test_bms_host*.py'
      - '.github/workflows/host-tests.yml'
  pull_request:
    paths:
      - 'TOOLS/bms_host/**'
      - 'Tests/test_bms_host*.py'
      - '.github/workflows/host-tests.yml'

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: python -m pip install -r TOOLS/bms_host/requirements.txt

      - name: 运行上位机单元测试
        run: python -m unittest discover -s Tests -p "test_bms_host*.py" -v
