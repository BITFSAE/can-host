name: 上位机 Windows 与 macOS 构建发布

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # 国内下载镜像：cnb.cool 上的同一份发布产物，上位机更新器优先使用。
  CNB_REPO: totok22/can-host

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 核对标签版本与软件版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tagVersion = "$env:GITHUB_REF_NAME".Substring('v'.Length)
          $baseVersion = $tagVersion.Split('-')[0]
          $appVersion = python -c "from canhost import __version__; print(__version__)"
          if ($baseVersion -ne $appVersion) {
            throw "标签 $env:GITHUB_REF_NAME 的版本 $baseVersion 与 canhost/__init__.py 的 __version__ = $appVersion 不一致，先更新版本号再打标签。"
          }

      - name: 计算产物标签
        id: label
        shell: pwsh
        run: |
          if ("$env:GITHUB_REF".StartsWith('refs/tags/')) {
            $label = "$env:GITHUB_REF_NAME"
          } else {
            $label = "$env:GITHUB_SHA".Substring(0, 7)
          }
          "label=$label" >> $env:GITHUB_OUTPUT

      - name: 运行测试、打包并生成发布产物
        # build_windows.ps1 统一生成 release\ 下的 ZIP、.sha256 和 Setup 安装包，
        # 与软件内更新器使用的附件命名保持一致；CI 要求 Inno Setup 必须存在。
        run: powershell -ExecutionPolicy Bypass -File build_windows.ps1 -Label "${{ steps.label.outputs.label }}" -RequireInstaller

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: BITFSAE_CAN_Host_windows_${{ steps.label.outputs.label }}
          path: release/*
          if-no-files-found: error

  build-macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 核对构建架构
        run: test "$(uname -m)" = "arm64"

      - name: 计算产物标签
        id: label
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            label="$GITHUB_REF_NAME"
          else
            label="${GITHUB_SHA:0:7}"
          fi
          echo "label=$label" >> "$GITHUB_OUTPUT"

      - name: 运行测试、打包并生成 Apple Silicon DMG
        run: bash build_macos.sh "${{ steps.label.outputs.label }}"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: BITFSAE_CAN_Host_macos_arm64_${{ steps.label.outputs.label }}
          path: release/*
          if-no-files-found: error

  publish:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/download-artifact@v4
        with:
          pattern: BITFSAE_CAN_Host_*
          path: release
          merge-multiple: true

      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          mkdir -p build/release-notes
          notes_file="build/release-notes/release_notes.md"
          python scripts/release_notes.py --version "${tag#v}" \
            --output "$notes_file" \
            --json-output build/release-notes/release_notes.json
          prerelease=()
          if [[ "${tag#v}" == *-* ]]; then prerelease+=(--prerelease); fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file "$notes_file"
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* --title "$tag" --notes-file "$notes_file" "${prerelease[@]}"
          fi

      - name: 同步发布产物到 CNB 镜像
        # 上传与 GitHub Release 完全相同的 Windows/macOS 附件，并刷新上位机
        # 在国内匿名读取的更新频道。镜像落后会让国内用户停在旧版本，因此失败即发布失败。
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CNB_TOKEN:-}" ]]; then
            echo "::error::仓库缺少 Actions secret CNB_TOKEN，无法同步到 CNB 镜像"
            exit 1
          fi
          tag="$GITHUB_REF_NAME"
          metadata="release/github-release.json"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,body,publishedAt,isPrerelease > "$metadata"
          mapfile -t assets < <(find release -maxdepth 1 -type f ! -name 'github-release.json' -print | sort)
          if [[ ${#assets[@]} -ne 7 ]]; then
            echo "::error::预期 7 个双平台发布附件，实际找到 ${#assets[@]} 个"
            printf '%s\n' "${assets[@]}"
            exit 1
          fi
          arguments=(scripts/cnb_publish.py publish --repo "$CNB_REPO" \
                     --tag "$tag" --metadata-json "$metadata")
          for asset in "${assets[@]}"; do arguments+=(--asset "$asset"); done
          python "${arguments[@]}"
